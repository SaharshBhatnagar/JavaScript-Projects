<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODOLIST-JS</title>
    <link rel="stylesheet" href="styles/body.css">
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <main>
        <div class="heading"><p> Simple TodoList </p></div>
        <div class="Todo-list-head">
            <input class="Todo-input" id="todoInput" type="text" placeholder="Add a Todo...">
            <div class="todo-buttons">
                <button class="todo-add">Add</button>
            </div>
        </div>
        <div class="'todos-container">
            <div class="display-todo">
                <div class="todos-grp">
                    <span class="todos-number">1.</span>
                    <p class="todos-task">TASK HAS BEEN ADDED TO TODO LIST</p>
                </div>
                <div class="todos-btn-grp">
                    <button class="todo-edit">Edit</button>
                    <button class="todo-delete">Delete</button>
                </div>
            </div>
        </div>
    </main>
    <script src="scripts/script.js"></script>
</body>
</html>
